name: Generate example packs

# Manual only. Every real run spends xAI credits, so this is never on push
# and never on a schedule. The generator is resume-safe: it writes a pack
# only for a question that has no valid junior / senior / exec set yet, so
# re-running after a partial failure costs only what is still missing.
on:
  workflow_dispatch:
    inputs:
      company:
        description: Company to generate for
        required: true
        default: all
        type: choice
        options:
          - all
          - amazon
          - arm
          - coupang
          - delivery-hero
          - gitlab
      dry_run:
        description: Report what it would cost and write nothing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Passed through verbatim. generate.py understands "all" and the
          # words a boolean input produces, so there is no expression here to
          # get wrong. The cond && a || b idiom silently returns b when a is
          # an empty string, which is how "all" reached the script as a
          # company name and matched nothing.
          BIQ_COMPANY: ${{ inputs.company }}
          BIQ_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/generate.py | tee run.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Example packs: ${{ inputs.company }}"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run. Nothing was generated and no credits were spent."
              echo
            fi
            echo '```'
            tail -n 20 run.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The packs land on a branch for review rather than on the default
      # branch. They are model-written interview content that people are
      # assessed against, so a human reads a few before they ship.
      - name: Open a pull request with the new packs
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: examples/${{ inputs.company }}
          delete-branch: true
          add-paths: data/examples
          commit-message: Generate example packs for ${{ inputs.company }}
          title: "Example packs for ${{ inputs.company }}"
          body: |
            Generated by the `Generate example packs` workflow.

            Review before merging. These are model-written transcripts that
            candidates get assessed against. The usual failure is a pack whose
            `raise` and `lower` transcripts are not meaningfully different.

            This pull request does **not** flip `"examples": true` in
            `data/questions.json`. Do that by hand once the packs read well,
            because that flag is what makes the buttons appear in the UI.
